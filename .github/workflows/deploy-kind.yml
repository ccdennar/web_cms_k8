name: Sweetcrumb Bakery - Kubernetes CI/CD

# ============================================
# PHASE 4: KUBERNETES DEPLOYMENT
# ============================================

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      app_ref:
        description: "web_cms branch, tag, or commit"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: sweetcrumb-k8s-${{ github.ref }}
  cancel-in-progress: true

# ============================================
# GLOBAL ENVIRONMENT VARIABLES
# ============================================

env:
  APP_REPOSITORY: ccdennar/web_cms
  APP_DIR: application/bakery-backend

  IMAGE_NAME: sweetcrumb-bakery-backend
  IMAGE_TAG: ci

  CLUSTER_NAME: sweetcrumb
  NAMESPACE: sweetcrumb

jobs:

  # ==========================================
  # JOB 1: BUILD, DEPLOY AND TEST
  # ==========================================

  kubernetes-deployment:
    name: Build, Deploy and Test on Kind

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      # ======================================
      # STAGE 1: CHECKOUT KUBERNETES REPO
      # ======================================

      - name: Checkout Kubernetes repository
        uses: actions/checkout@v4
        with:
          path: infrastructure

      # ======================================
      # STAGE 2: CHECKOUT APPLICATION REPO
      # ======================================

      - name: Checkout web_cms application
        uses: actions/checkout@v4
        with:
          repository: ccdennar/web_cms
          ref: ${{ inputs.app_ref || 'main' }}
          path: application
          persist-credentials: false

      # ======================================
      # STAGE 3: VERIFY APPLICATION SOURCE
      # ======================================

      - name: Verify application Dockerfile
        run: |
          set -euo pipefail

          echo "Verifying application source..."

          test -f "$APP_DIR/Dockerfile"
          test -f "$APP_DIR/package.json"

          echo "Application source verified."

          echo "Application commit:"
          git -C application rev-parse HEAD

      # ======================================
      # STAGE 4: VALIDATE KUBERNETES MANIFESTS
      # ======================================

      - name: Validate Kubernetes manifests
        run: |
          set -euo pipefail

          echo "Validating Kubernetes manifests..."

          kubectl kustomize \
            infrastructure/k8s/overlays/local \
            > /tmp/sweetcrumb-manifests.yaml

          test -s /tmp/sweetcrumb-manifests.yaml

          echo "Kubernetes manifests rendered successfully."

      # ======================================
      # STAGE 5: CONFIGURE DOCKER
      # ======================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ======================================
      # STAGE 6: BUILD DOCKER IMAGE
      # ======================================

      - name: Build backend Docker image
        run: |
          set -euo pipefail

          echo "Building Sweetcrumb Bakery backend..."

          docker build \
            --file "$APP_DIR/Dockerfile" \
            --tag "$IMAGE_NAME:$IMAGE_TAG" \
            "$APP_DIR"

          docker image inspect "$IMAGE_NAME:$IMAGE_TAG"

          echo "Docker image built successfully."

      # ======================================
      # STAGE 7: CREATE KIND CLUSTER
      # ======================================

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: sweetcrumb
          wait: 120s

      # ======================================
      # STAGE 8: LOAD IMAGE INTO KIND
      # ======================================

      - name: Load Docker image into Kind
        run: |
          set -euo pipefail

          kind load docker-image \
            "$IMAGE_NAME:$IMAGE_TAG" \
            --name "$CLUSTER_NAME"

          echo "Docker image loaded into Kind."

      # ======================================
      # STAGE 9: CREATE NAMESPACE
      # ======================================

      - name: Create Kubernetes namespace
        run: |
          kubectl apply \
            -f infrastructure/k8s/base/namespace.yaml

      # ======================================
      # STAGE 10: CREATE CI SECRETS
      # ======================================

      - name: Create Kubernetes test Secrets
        env:
          DB_PASSWORD: ci-local-password
          CMS_SECRET: ci-local-payload-secret
        run: |
          set -euo pipefail
          echo "Creating Kubernetes secrets for CI environment..."
          
          # Create the secret with the EXACT name your postgres manifest expects
          kubectl -n "$NAMESPACE" create secret generic bakery-secrets \
            --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
            --from-literal=DATABASE_URL="postgresql://bakery:${DB_PASSWORD}@postgres:5432/bakery" \
            --from-literal=PAYLOAD_SECRET="$CMS_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -
            
          echo "✅ CI test Secrets created successfully."

      # ======================================
      # STAGE 11: DEPLOY POSTGRESQL AND APP
      # ======================================

      - name: Deploy Kubernetes manifests
        run: |
          set -euo pipefail

          kubectl apply -k \
            infrastructure/k8s/overlays/local

          kubectl -n "$NAMESPACE" \
            set image deployment/bakery-backend \
            bakery-backend="$IMAGE_NAME:$IMAGE_TAG"

          echo "Kubernetes resources deployed."

      # =========================================
      # STAGE 12: WAIT FOR POSTGRESQL (WITH DIAGNOSTICS)
      # ======================================
      - name: Wait for PostgreSQL
        run: |
          echo "⏳ Waiting for PostgreSQL to be ready..."
          
          # 1. Check if it's a StatefulSet or Deployment and wait accordingly
          if kubectl -n "$NAMESPACE" get statefulset postgres > /dev/null 2>&1; then
            echo "Found StatefulSet 'postgres'. Waiting for rollout..."
            kubectl -n "$NAMESPACE" rollout status statefulset/postgres --timeout=240s || {
              echo "❌ PostgreSQL StatefulSet failed to become ready."
              echo "--- Pod Status ---"
              kubectl -n "$NAMESPACE" get pods -l app=postgres || true
              echo "--- Pod Logs ---"
              kubectl -n "$NAMESPACE" logs statefulset/postgres --tail=50 || true
              echo "--- Pod Describe ---"
              kubectl -n "$NAMESPACE" describe statefulset postgres || true
              exit 1
            }
          elif kubectl -n "$NAMESPACE" get deployment postgres > /dev/null 2>&1; then
            echo "Found Deployment 'postgres'. Waiting for rollout..."
            kubectl -n "$NAMESPACE" rollout status deployment/postgres --timeout=240s || {
              echo "❌ PostgreSQL Deployment failed to become ready."
              echo "--- Pod Status ---"
              kubectl -n "$NAMESPACE" get pods -l app=postgres || true
              echo "--- Pod Logs ---"
              kubectl -n "$NAMESPACE" logs deployment/postgres --tail=50 || true
              echo "--- Pod Describe ---"
              kubectl -n "$NAMESPACE" describe deployment postgres || true
              exit 1
            }
          else
            echo "❌ Neither StatefulSet nor Deployment named 'postgres' found in namespace $NAMESPACE"
            echo "--- All Resources in Namespace ---"
            kubectl -n "$NAMESPACE" get all
            exit 1
          fi
          
          echo "✅ PostgreSQL is ready and accepting connections."

            # ======================================
      # STAGE 12b: RUN PAYLOAD MIGRATIONS (STRICT & VERIFIED)
      # ======================================
      - name: Run Payload CMS Migrations
        env:
          DB_PASSWORD: ci-local-password
          CMS_SECRET: ci-local-payload-secret
        run: |
          set -euo pipefail
          echo "🔄 Running Payload CMS database migrations..."
          
          # 1. Port-forward the PostgreSQL SERVICE to the GitHub runner
          echo "Starting port-forward to PostgreSQL service..."
          kubectl -n "$NAMESPACE" port-forward svc/postgres 5432:5432 &
          PF_PID=$!
          
          # 2. Wait and verify the port-forward is actually accepting connections
          echo "Waiting for port-forward to be ready..."
          sleep 5
          
          # Install postgresql-client briefly to verify the connection
          sudo apt-get update && sudo apt-get install -y postgresql-client > /dev/null 2>&1
          
          # Verify the port is open and accepting connections
          if ! pg_isready -h localhost -p 5432; then
            echo "❌ Failed to connect to port-forwarded database."
            kubectl -n "$NAMESPACE" get pods || true
            kill $PF_PID || true
            exit 1
          fi
          echo "✅ Port-forward verified. Database is reachable at localhost:5432"
          
          # 3. Navigate to the checked-out application source
          cd application/bakery-backend
          
          # 4. Install dependencies (required for the payload CLI)
          echo "Installing dependencies for migration..."
          corepack enable
          pnpm install --frozen-lockfile
          
          # 5. Run the migration against the port-forwarded database
          echo "Executing migrations..."
          export DATABASE_URL="postgresql://bakery:${DB_PASSWORD}@localhost:5432/bakery"
          export PAYLOAD_SECRET="${CMS_SECRET}"
          
          echo "🔑 Using DATABASE_URL: $DATABASE_URL"
          
          # STRICT MODE: If this fails, the workflow MUST fail. No silent fallbacks.
          npx payload migrate
          
          # 6. VERIFY: Check if tables were actually created in the database
          echo "🔍 Verifying tables were created..."
          PGPASSWORD="$DB_PASSWORD" psql -h localhost -U bakery -d bakery -c "\dt"
          
          # 7. Clean up port-forward
          kill $PF_PID || true
          
          echo "✅ Database migrations completed and verified successfully."
     

      # ======================================
      # STAGE 13: POSTGRESQL INTEGRATION TEST
      # ======================================

      - name: Test PostgreSQL connectivity
        run: |
          set -euo pipefail

          echo "Testing PostgreSQL authentication..."

          kubectl -n "$NAMESPACE" exec postgres-0 -- \
            sh -c '
              PGPASSWORD="$POSTGRES_PASSWORD" \
              psql -U bakery -d bakery \
                -v ON_ERROR_STOP=1 \
                -c "SELECT current_database(), current_user;"
            '

          echo "PostgreSQL integration test passed."

      # ======================================
      # STAGE 14: WAIT FOR APPLICATION
      # ======================================

      - name: Wait for backend rollout
        run: |
          kubectl -n "$NAMESPACE" \
            rollout status deployment/bakery-backend \
            --timeout=360s

      # ======================================
      # STAGE 15: APPLICATION SMOKE TEST
      # ======================================

      - name: Run application HTTP smoke test
        run: |
          set -euo pipefail

          echo "Testing Payload CMS HTTP endpoint..."

          kubectl -n "$NAMESPACE" run bakery-smoke-test \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm \
            -i \
            --command -- \
            sh -ec '
              for attempt in $(seq 1 30); do

                if curl -fsS \
                  --max-time 5 \
                  http://bakery-backend/admin \
                  -o /dev/null; then

                  echo "Application smoke test passed."
                  exit 0
                fi

                echo "Waiting for application..."
                sleep 5
              done

              echo "Application smoke test failed."
              exit 1
            '

      # ======================================
      # STAGE 16: APPLICATION DATABASE TEST
      # ======================================

      - name: Verify application database integration
        run: |
          set -euo pipefail

          echo "Checking Payload CMS database integration..."

          if ! kubectl -n "$NAMESPACE" run bakery-db-test \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm \
            -i \
            --command -- \
            sh -ec '
              for attempt in $(seq 1 20); do
                CODE=$(curl -sS --max-time 10 -o /tmp/out \
                  -w "%{http_code}" http://bakery-backend/api/health || echo 000)
                if [ "$CODE" = "200" ]; then
                  cat /tmp/out; echo
                  echo "Application database integration passed."
                  exit 0
                fi
                echo "Attempt $attempt: HTTP $CODE"
                cat /tmp/out 2>/dev/null; echo
                sleep 5
              done
              echo "Application database integration failed."
              exit 1
            '; then
            echo "===== BACKEND LOGS (last 200 lines) ====="
            kubectl -n "$NAMESPACE" logs deployment/bakery-backend --tail=200 || true
            exit 1
          fi

      # ======================================
      # STAGE 17: VERIFY KUBERNETES RESOURCES
      # ======================================

      - name: Verify Kubernetes resources
        run: |
          set -euo pipefail

          echo "===== PODS ====="
          kubectl -n "$NAMESPACE" get pods -o wide

          echo "===== DEPLOYMENTS ====="
          kubectl -n "$NAMESPACE" get deployments

          echo "===== SERVICES ====="
          kubectl -n "$NAMESPACE" get services

          echo "===== STATEFULSETS ====="
          kubectl -n "$NAMESPACE" get statefulsets

          echo "===== PVC ====="
          kubectl -n "$NAMESPACE" get pvc

          echo "===== HPA ====="
          kubectl -n "$NAMESPACE" get hpa

          echo "===== PDB ====="
          kubectl -n "$NAMESPACE" get pdb

          echo "===== NETWORK POLICIES ====="
          kubectl -n "$NAMESPACE" get networkpolicy

      # ======================================
      # STAGE 18: TROUBLESHOOT ON FAILURE
      # ======================================

      - name: Collect failure diagnostics
        if: failure()
        run: |
          echo "===== CLUSTER INFO ====="
          kubectl cluster-info || true

          echo "===== PODS ====="
          kubectl -n "$NAMESPACE" get pods -o wide || true

          echo "===== POD DETAILS ====="
          kubectl -n "$NAMESPACE" describe pods || true

          echo "===== DEPLOYMENTS ====="
          kubectl -n "$NAMESPACE" get deployments || true

          echo "===== STATEFULSETS ====="
          kubectl -n "$NAMESPACE" get statefulsets || true

          echo "===== PVC ====="
          kubectl -n "$NAMESPACE" get pvc || true

          echo "===== SERVICES ====="
          kubectl -n "$NAMESPACE" get services || true

          echo "===== ENDPOINT SLICES ====="
          kubectl -n "$NAMESPACE" get endpointslices || true

          echo "===== EVENTS ====="
          kubectl -n "$NAMESPACE" get events \
            --sort-by=.metadata.creationTimestamp || true

          echo "===== BACKEND LOGS ====="
          kubectl -n "$NAMESPACE" logs \
            deployment/bakery-backend \
            --all-containers=true \
            --tail=100 || true

          echo "===== POSTGRESQL LOGS ====="
          kubectl -n "$NAMESPACE" logs \
            statefulset/postgres \
            --tail=100 || true

          echo "===== BACKEND ROLLOUT ====="
          kubectl -n "$NAMESPACE" rollout status \
            deployment/bakery-backend \
            --timeout=10s || true

      # ======================================
      # STAGE 19: PUBLISH TEST SUMMARY
      # ======================================

      - name: Publish Kubernetes test summary
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          {
            echo "## Sweetcrumb Bakery - Kubernetes Phase 4"
            echo ""
            echo "| Component | Value |"
            echo "|---|---|"
            echo "| Application repository | ccdennar/web_cms |"
            echo "| Kubernetes cluster | Kind |"
            echo "| Namespace | sweetcrumb |"
            echo "| Container image | sweetcrumb-bakery-backend:ci |"
            echo "| PostgreSQL integration | Included |"
            echo "| Application smoke test | Included |"
            echo "| Application DB integration | Included |"
            echo "| Result | ${JOB_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
