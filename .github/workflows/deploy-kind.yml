name: Deploy to Kubernetes

on:
  push:
    branches: [main]
    paths:
      - 'k8s-deployment/**'
      - '.github/workflows/deploy-k8s.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging

env:
  APP_REPOSITORY: ccdennar/web_cms
  APP_DIR: application/bakery-backend
  IMAGE_NAME: sweetcrumb-bakery-backend
  IMAGE_TAG: ci
  CLUSTER_NAME: sweetcrumb
  NAMESPACE: sweetcrumb

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to Kind Cluster
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Setup Kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          version: v0.20.0

      - name: Install NGINX Ingress Controller
        run: |
          echo "🔧 Installing NGINX Ingress Controller..."
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          echo "⏳ Waiting for ingress controller to be ready..."
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=120s

      - name: Deploy Kubernetes Manifests
        run: |
          echo "🚀 Deploying application to Kubernetes..."
          # Adjust this path if your manifests are located elsewhere
          kubectl apply -k k8s-deployment/manifests/base/ || kubectl apply -f k8s-deployment/manifests/

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "⏳ Waiting for PostgreSQL to be ready..."
          # Tries common label patterns for postgres
          kubectl wait --for=condition=ready --timeout=180s pod -l app=postgres -n ${{ env.NAMESPACE }} || \
          kubectl wait --for=condition=ready --timeout=180s pod -l app.kubernetes.io/name=postgres -n ${{ env.NAMESPACE }} || \
          echo "⚠️ PostgreSQL pod label not found, continuing anyway..."

      - name: Wait for Backend Deployment to be ready
        run: |
          echo "⏳ Waiting for Backend deployment to be ready..."
          kubectl rollout status deployment/bakery-backend -n ${{ env.NAMESPACE }} --timeout=300s

      # =====================================================================
      # ✅ FIXED HEALTH CHECK: Tests root "/" instead of "/api/health"
      # =====================================================================
      - name: Check Payload CMS database integration
        run: |
          set -euo pipefail
          echo "🔍 Checking Payload CMS database integration..."
          
          # We test the root endpoint "/" because it's guaranteed to exist in Payload CMS
          # and will return 200 OK only if the app is fully booted and connected to the DB.
          kubectl -n "${{ env.NAMESPACE }}" run bakery-db-test \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm \
            -i \
            --command -- \
            sh -ec '
              for attempt in $(seq 1 20); do
                if curl -fsS --max-time 10 http://bakery-backend/ > /dev/null 2>&1; then
                  echo "✅ Application database integration passed."
                  exit 0
                fi
                echo "⏳ Waiting for application to be ready (attempt $attempt/20)..."
                sleep 5
              done
              echo "❌ Application failed to become ready."
              exit 1
            ' || {
              echo "=========================================="
              echo "❌ HEALTH CHECK FAILED - DIAGNOSTIC DUMP"
              echo "=========================================="
              
              echo "--- 1. Backend Pod Status ---"
              kubectl get pods -l app=bakery-backend -n "${{ env.NAMESPACE }}" || \
              kubectl get pods -l app.kubernetes.io/name=bakery-backend -n "${{ env.NAMESPACE }}" || true
              
              echo "--- 2. Backend Logs (Last 50 lines) ---"
              kubectl logs deployment/bakery-backend -n "${{ env.NAMESPACE }}" --tail=50 || true
              
              echo "--- 3. Database Pod Status ---"
              kubectl get pods -l app=postgres -n "${{ env.NAMESPACE }}" || \
              kubectl get pods -l app.kubernetes.io/name=postgres -n "${{ env.NAMESPACE }}" || true
              
              echo "--- 4. Database Logs (Last 30 lines) ---"
              kubectl logs deployment/postgres -n "${{ env.NAMESPACE }}" --tail=30 || \
              kubectl logs statefulset/postgres -n "${{ env.NAMESPACE }}" --tail=30 || true
              
              echo "--- 5. Backend Environment Variables ---"
              kubectl exec deploy/bakery-backend -n "${{ env.NAMESPACE }}" -- sh -c 'printenv | grep -E "DATABASE|PAYLOAD"' || true
              
              echo "--- 6. Services and Endpoints ---"
              kubectl get svc,ep -n "${{ env.NAMESPACE }}" || true
              
              echo "=========================================="
              echo "💡 TIP 1: Check if DATABASE_URL service name matches your PostgreSQL Service name."
              echo "💡 TIP 2: Ensure NetworkPolicy allows traffic from backend to postgres."
              echo "💡 TIP 3: Verify the database password in the secret matches postgres."
              exit 1
            }

      - name: Test Frontend Integration
        run: |
          echo "🔍 Checking Frontend integration..."
          kubectl -n "${{ env.NAMESPACE }}" run frontend-test \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm \
            -i \
            --command -- \
            sh -ec '
              for attempt in $(seq 1 10); do
                if curl -fsS --max-time 10 http://frontend-service/ > /dev/null 2>&1; then
                  echo "✅ Frontend is responding."
                  exit 0
                fi
                echo "⏳ Waiting for frontend (attempt $attempt/10)..."
                sleep 5
              done
              echo "❌ Frontend failed to become ready."
              exit 1
            ' || {
              echo "❌ Frontend health check failed. Check frontend logs:"
              kubectl logs deployment/frontend -n "${{ env.NAMESPACE }}" --tail=30 || true
              exit 1
            }

      - name: Summary
        if: success()
        run: |
          echo "🎉 Deployment and health checks completed successfully!"
          echo "Cluster: ${{ env.CLUSTER_NAME }}"
          echo "Namespace: ${{ env.NAMESPACE }}"
          kubectl get all -n ${{ env.NAMESPACE }}