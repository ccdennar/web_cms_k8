
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bakery-backend
  namespace: sweetcrumb
spec:
  replicas: 2

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: bakery-backend

  template:
    metadata:
      labels:
        app: bakery-backend

    spec:
      serviceAccountName: bakery-backend

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: bakery-backend

          image: sweetcrumb-bakery-backend:ci
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          envFrom:
            - configMapRef:
                name: bakery-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bakery-secrets
                  key: DATABASE_URL

            - name: PAYLOAD_SECRET
              valueFrom:
                secretKeyRef:
                  name: bakery-secrets
                  key: PAYLOAD_SECRET

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
