apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bakery-backend
  namespace: sweetcrumb
spec:
  ingressClassName: nginx
  rules:
    - host: bakery.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bakery-backend
                port:
                  number: 80